name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | sed -E 's/.*version "([0-9]+).*/\1/')
          if [ -z "$JAVA_MAJOR" ] || ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "Error: Unable to detect Java major version."
            exit 1
          fi
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Active Java version is $JAVA_MAJOR, but version 17 or newer is required."
            exit 1
          fi
          echo "Java environment verified: Java $JAVA_MAJOR (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: debug.keystore could not be verified."
            exit 1
          fi
          echo "Temporary debug keystore is ready."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "Error: Expected APK not found at $TARGET_APK"
            echo "Listing files found in app/build/outputs/apk:"
            find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk" || true
            exit 1
          fi
          if [ ! -s "$TARGET_APK" ]; then
            echo "Error: $TARGET_APK is empty."
            exit 1
          fi
          case "$TARGET_APK" in
            *.apk) ;;
            *) echo "Error: $TARGET_APK does not have .apk extension."; exit 1 ;;
          esac
          echo "APK verified successfully: $TARGET_APK ($(stat -c%s "$TARGET_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          TEMP_ASSET_DIR="${{ runner.temp }}/release_apk_asset"
          mkdir -p "$TEMP_ASSET_DIR"
          cp "$SRC_APK" "$TEMP_ASSET_DIR/app-debug.apk"
          ASSET_FILE="$TEMP_ASSET_DIR/app-debug.apk"
          if [ ! -f "$ASSET_FILE" ] || [ ! -s "$ASSET_FILE" ]; then
            echo "Error: Failed to prepare release asset."
            exit 1
          fi
          echo "asset_path=$ASSET_FILE" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset at: $ASSET_FILE"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          RELEASE_ASSET="${{ steps.prep_asset.outputs.asset_path }}"
          if [ ! -f "$RELEASE_ASSET" ] || [ ! -s "$RELEASE_ASSET" ]; then
            echo "Error: Release asset $RELEASE_ASSET missing or empty."
            exit 1
          fi
          case "$RELEASE_ASSET" in
            */app-debug.apk) ;;
            *) echo "Error: Asset filename is not app-debug.apk"; exit 1 ;;
          esac

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES="### Debug APK Build Details
          - **Build Type**: Automatically generated debug APK
          - **Built by**: GitHub Actions
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Source Commit**: ${{ github.sha }}
          - **Notice**: This APK is intended for testing purposes only and is not a Play Store production release. It is signed with a temporary debug keystore."

          echo "Creating release $TAG_NAME..."
          gh release create "$TAG_NAME" "$RELEASE_ASSET" \
            --title "$TITLE" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "$NOTES"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=== RELEASE SUCCESSFUL ==="
            gh release view "$TAG_NAME"
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release APK Asset: app-debug.apk"
            echo "Direct Download URL: $DIRECT_URL"

            {
              echo "### 📱 DIRECT APK DOWNLOAD"
              echo ""
              echo "Download the latest debug APK directly:"
              echo "[$DIRECT_URL]($DIRECT_URL)"
              echo ""
              echo "> **Note**: The backup Actions artifact \`app-debug-apk\` is also preserved."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release creation failed or was skipped."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "APK was built successfully and is preserved as GitHub Actions artifact 'app-debug-apk'."
            fi
            {
              echo "### ⚠️ GitHub Release Notice"
              echo "Release creation encountered an issue, but the debug APK was built and is safely available in GitHub Actions artifacts under \`app-debug-apk\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
