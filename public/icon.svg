<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="12" y1="12" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B4B32"/>
      <stop offset="0.5" stop-color="#073B27"/>
      <stop offset="1" stop-color="#032417"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background with subtle rounded corners -->
  <rect width="108" height="108" rx="24" fill="url(#bgGrad)"/>

  <!-- Subtle Islamic Geometric Background Circle and Hexagon -->
  <circle cx="54" cy="54" r="32" fill="#FFFFFF" fill-opacity="0.08"/>
  <polygon points="54,26 73.8,37.4 73.8,60.2 54,71.6 34.2,60.2 34.2,37.4" fill="none" stroke="#D4AF37" stroke-width="1.2" stroke-opacity="0.25"/>

  <!-- The Holy Quran on Stand Group with shadow -->
  <g filter="url(#glow)">
    <!-- Golden Rehal (wooden book stand) bottom legs -->
    <path fill="#C8963E" d="M38,68 L48,78 L54,72 L60,78 L70,68 L64,64 L54,70 L44,64 Z"/>
    <path fill="#9E7328" d="M48,78 L50,81 L58,81 L60,78 L54,74 Z"/>

    <!-- Quran Cover Edge (Emerald / Gold trim) -->
    <path fill="#105C3E" d="M54,67 C44,64 33,67 30,68 L27,65 L27,48 C27,46 29,43.5 32,43 C43,40 54,43 54,43 Z"/>
    <path fill="#1B7A53" d="M54,67 C64,64 75,67 78,68 L81,65 L81,48 C81,46 79,43.5 76,43 C65,40 54,43 54,43 Z"/>

    <!-- Open Quran Book Pages (Outer Left and Right page blocks) -->
    <path fill="#F6F0DF" d="M54,42 C54,42 46,39 33,42 C30,42.7 28,45 28,48 L28,64 C28,66 30,68 33,67 C44,64 54,67 54,67 Z"/>
    <path fill="#FFFDF7" d="M54,42 C54,42 62,39 75,42 C78,42.7 80,45 80,48 L80,64 C80,66 78,68 75,67 C64,64 54,67 54,67 Z"/>

    <!-- Inner Book Fold / Spine Shadow -->
    <path fill="#E2D4B7" d="M52,42 L56,42 L56,67 L52,67 Z"/>

    <!-- Quranic Calligraphy / Lines representation on left & right pages -->
    <path fill="#D4AF37" d="M33,48 L49,48 C49.5,48 50,48.5 50,49 C50,49.5 49.5,50 49,50 L33,50 C32.5,50 32,49.5 32,49 C32,48.5 32.5,48 33,48 Z"/>
    <path fill="#D4AF37" d="M34,53 L48,53 C48.5,53 49,53.5 49,54 C49,54.5 48.5,55 48,55 L34,55 C33.5,55 33,54.5 33,54 C33,53.5 33.5,53 34,53 Z"/>
    <path fill="#D4AF37" d="M35,58 L47,58 C47.5,58 48,58.5 48,59 C48,59.5 47.5,60 47,60 L35,60 C34.5,60 34,59.5 34,59 C34,58.5 34.5,58 35,58 Z"/>

    <path fill="#D4AF37" d="M59,48 L75,48 C75.5,48 76,48.5 76,49 C76,49.5 75.5,50 75,50 L59,50 C58.5,50 58,49.5 58,49 C58,48.5 58.5,48 59,48 Z"/>
    <path fill="#D4AF37" d="M60,53 L74,53 C74.5,53 75,53.5 75,54 C75,54.5 74.5,55 74,55 L60,55 C59.5,55 59,54.5 59,54 C59,53.5 59.5,53 60,53 Z"/>
    <path fill="#D4AF37" d="M61,58 L73,58 C73.5,58 74,58.5 74,59 C74,59.5 73.5,60 73,60 L61,60 C60.5,60 60,59.5 60,59 C60,58.5 60.5,58 61,58 Z"/>

    <!-- Ribbon Bookmark (Red/Gold) hanging down -->
    <path fill="#D9383A" d="M52,43 L56,43 L56,73 L54,70 L52,73 Z"/>

    <!-- Crescent Moon & Star above the Quran -->
    <path fill="#F6C844" d="M54,25 C58.4,25 62,28.6 62,33 C62,35.4 60.9,37.6 59.2,39 C61.5,37.8 63,35.5 63,32.8 C63,28.8 59.7,25.5 55.7,25.5 C55.1,25.5 54.5,25.6 54,25.7 C54.3,25.3 54,25 54,25 Z"/>
    <polygon points="58,30.5 58.8,32 60.5,32.2 59.2,33.4 59.6,35 58,34.1 56.4,35 56.8,33.4 55.5,32.2 57.2,32" fill="#F6C844"/>
  </g>
</svg>
